# ──────────────────────────────────────────────
# 사이트 기본 정보
# ──────────────────────────────────────────────
title: "Martin's Career"
description: "Solutions Architect Portfolio"
url: "https://martincareer.github.io"
baseurl: ""
locale: "ko-KR"

# ──────────────────────────────────────────────
# 테마 설정 — 없음
# ──────────────────────────────────────────────
# remote_theme(mmistakes/minimal-mistakes@4.26.2)과 minimal_mistakes_skin("air")을
# 제거했다. 셸은 _layouts/default.html·page.html + _includes/*가 직접 그리고,
# CSS는 assets/css/main.scss가 _sass/custom/* 파티셜만 임포트한다 — 테마의
# 레이아웃·인클루드·SCSS 어느 것도 참조하는 곳이 없다.
# skin은 테마 SCSS에 색을 먹이는 값이었고, 이제 색은 _sass/custom/_tokens.scss가
# 전부 정의한다.

# ──────────────────────────────────────────────
# 저자 정보
# ──────────────────────────────────────────────
author:
  name: "Martin"
  avatar: "/assets/images/profile-hero.jpg"
  bio: "Solutions Architect"
  location: "South Korea"
  links:
    - label: "Tech Blog"
      icon: "fas fa-fw fa-blog"
      url: "https://martinmlops.github.io"
    - label: "Instagram"
      icon: "fab fa-fw fa-instagram"
      url: "https://www.instagram.com/_martlln"

# ──────────────────────────────────────────────
# 플러그인
# ──────────────────────────────────────────────
plugins:
  # jekyll-remote-theme 제거 — remote_theme 키가 사라져 소비자가 없다.
  - jekyll-sitemap
  - jekyll-seo-tag
  - jekyll-include-cache

# ──────────────────────────────────────────────
# 기본값 설정
# ──────────────────────────────────────────────
# author_profile은 minimal-mistakes의 single.html(사이드바 프로필)에서만
# 읽던 값이었다. 셸을 자체 레이아웃(_layouts/default.html·page.html)으로
# 옮기면서 그 사이드바를 더 이상 렌더링하지 않으므로 제거했다 — 저자 사진은
# 이제 홈 히어로(_layouts/page.html의 .hero, page.url == "/"일 때만)에서만 보인다.
#
# 테마 전용 defaults 키(author_profile / toc / toc_sticky / share / related)는
# 이 블록에 남아 있는 것이 하나도 없음을 확인했다(grep 0건). 우리 레이아웃은
# layout / title / subtitle / tagline / current_role / headline_skills 만 읽는다.
defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: page

# ──────────────────────────────────────────────
# Markdown
# ──────────────────────────────────────────────
markdown: kramdown
kramdown:
  syntax_highlighter: rouge

# ──────────────────────────────────────────────
# 빌드 설정
# ──────────────────────────────────────────────
after_footer_scripts:
  - /assets/js/theme-toggle.js
  - /assets/js/contents-rail.js
  - /assets/js/back-button.js

include:
  - _pages

exclude:
  - "*.gem"
  - "*.gemspec"
  - node_modules
  - vendor
  - __tests__
  - package*.json
  - README.md
  - LICENSE
  # 비공개 원천 문서 — 고객사 실명·서비스 URL·관리자 키 포함. .gitignore로
  # git 추적은 안 되지만, Jekyll은 .gitignore를 보지 않고 소스 트리를 전부
  # 빌드하므로 여기서도 명시적으로 제외해야 _site/에 유출되지 않는다.
  #
  # 파일명을 있는 그대로 정확히 적었다(글롭이 아니다) — 두 가지 이유:
  #  1) 이 두 파일명은 이 iCloud 동기화 볼륨에서 NFD(자모 분해) 형태로
  #     저장돼 있어, 한글 접두사 + "*" 형태의 glob을 NFC로 적으면 바이트가
  #     달라 File.fnmatch가 매치하지 못한다(Ruby로 직접 검증함). 아래 값은
  #     Dir.entries로 읽은 실제 바이트를 그대로 옮겼다.
  #  2) Jekyll의 EntryFilter#glob_include?는 File.fnmatch?를 FNM_PATHNAME
  #     없이 호출한다 — 즉 "*"가 "/"까지 건너뛴다. 순수 확장자 glob
  #     ("*.jpg" 등)을 썼다면 assets/images/slides/*.jpg(프로젝트 아키텍처
  #     이미지)까지 통째로 빌드에서 사라진다(실제로 겪었다). 파일명을
  #     정확히 적으면 glob 메타문자가 없어 이 문제가 근본적으로 없다.
  - "내부세미나_분임조5조.html"
  - "career_*.md"
  - "경력기술서_*.md"
  - "architecture-overview.jpg"
  # 프로필 원본(9MB). .gitignore에는 있었지만 exclude에 없어서 매 빌드마다
  # _site/assets/images/profile_latest.JPG 로 그대로 복사되고 있었다.
  # 파일명이 순수 ASCII(18바이트, NFD 문제 없음)임을 Dir.entries 바이트로
  # 확인했고, glob 메타문자가 없는 정확한 경로라 assets/images/slides/*.jpg
  # (아키텍처 이미지 9장)를 건드릴 위험이 없다.
  - "assets/images/profile_latest.JPG"
  - "다이소_분임조_5조_Architecture-임베딩(사전 처리).jpg"
  - "다이소_분임조_5조_Architecture-전체 아키텍처.jpg"
